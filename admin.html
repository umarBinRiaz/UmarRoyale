<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS Access | UMAR ROYALE</title>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light text-dark py-5">

    <div class="container">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-5">
            <div>
                <h2 class="mb-0 fw-bold">UMAR ROYALE — CMS Panel</h2>
                <small class="text-muted">Manage Products & Order Statuses</small>
            </div>
            <a href="index.html" class="btn btn-outline-dark"><i class="fa-solid fa-arrow-left me-2"></i>Back To Store</a>
        </div>

        <!-- ORDERS SECTION -->
        <div class="row mb-5">
            <div class="col-12">
                <div class="card p-4 shadow-sm border-0">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h4 class="text-uppercase mb-0"><i class="fa-solid fa-box me-2"></i>Customer Orders</h4>
                        <button class="btn btn-sm btn-outline-danger" onclick="clearAllOrders()">Clear All History</button>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-dark">
                                <tr>
                                    <th>Order ID</th>
                                    <th>Date</th>
                                    <th>Customer Details</th>
                                    <th>Items Ordered</th>
                                    <th>Total Amount</th>
                                    <th>Update Status</th>
                                    <th class="text-end">Action</th>
                                </tr>
                            </thead>
                            <tbody id="cmsOrdersTable">
                                <!-- Dynamic Orders -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- PRODUCTS SECTION -->
        <div class="row g-5">
            <!-- Add Product -->
            <div class="col-lg-5">
                <div class="card p-4 shadow-sm border-0">
                    <h4 class="mb-4 text-uppercase">Add New Product</h4>
                    <form id="addProductForm">
                        <div class="mb-3">
                            <label class="form-label font-monospace small">PRODUCT NAME</label>
                            <input type="text" id="prodName" class="form-control" placeholder="e.g. Amber Oud Imperial" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label font-monospace small">CATEGORY</label>
                            <select id="prodCategory" class="form-select" required>
                                <option value="EAU DE PARFUM">EAU DE PARFUM</option>
                                <option value="EXTRAIT DE PARFUM">EXTRAIT DE PARFUM</option>
                                <option value="PARFUM">PARFUM</option>
                                <option value="LIMITED EDITION">LIMITED EDITION</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label font-monospace small">PRICE ($)</label>
                            <input type="number" step="0.01" id="prodPrice" class="form-control" placeholder="280.00" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label font-monospace small">IMAGE URL</label>
                            <input type="url" id="prodImage" class="form-control" placeholder="https://images.unsplash.com/..." required>
                        </div>
                        <button type="submit" class="btn btn-dark w-100 py-2">PUBLISH TO STORE</button>
                    </form>
                </div>
            </div>

            <!-- Products Inventory -->
            <div class="col-lg-7">
                <div class="card p-4 shadow-sm border-0">
                    <h4 class="mb-4 text-uppercase">Live Inventory</h4>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-dark">
                                <tr>
                                    <th>Image</th>
                                    <th>Title</th>
                                    <th>Price</th>
                                    <th class="text-end">Action</th>
                                </tr>
                            </thead>
                            <tbody id="cmsProductsTable">
                                <!-- Dynamic Products -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- CMS Engine Scripts -->
    <script>
        // --- ORDERS MANAGEMENT LOGIC ---
        function renderOrdersTable() {
            const orders = JSON.parse(localStorage.getItem('umar_royale_orders')) || [];
            const tableBody = document.getElementById('cmsOrdersTable');

            if (!tableBody) return;

            if (orders.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted">No orders received yet.</td></tr>';
                return;
            }

            tableBody.innerHTML = orders.map(ord => `
                <tr>
                    <td class="fw-bold">${ord.orderId}</td>
                    <td class="small text-muted">${ord.date}</td>
                    <td>
                        <strong>${ord.customer.name}</strong><br>
                        <small class="text-muted"><i class="fa-solid fa-phone me-1"></i>${ord.customer.phone}</small><br>
                        <small class="text-muted"><i class="fa-solid fa-location-dot me-1"></i>${ord.customer.address}</small>
                    </td>
                    <td>
                        <ul class="list-unstyled mb-0 small">
                            ${ord.items.map(item => `<li>• ${item.name} (x${item.qty})</li>`).join('')}
                        </ul>
                    </td>
                    <td class="fw-bold text-success">${ord.total}</td>
                    <td>
                        <select class="form-select form-select-sm fw-semibold" onchange="updateOrderStatus('${ord.orderId}', this.value)">
                            <option value="Pending" ${ord.status === 'Pending' ? 'selected' : ''}>⏳ Pending</option>
                            <option value="Processing" ${ord.status === 'Processing' ? 'selected' : ''}>⚙️ Processing</option>
                            <option value="Shipped" ${ord.status === 'Shipped' ? 'selected' : ''}>🚚 Shipped</option>
                            <option value="Delivered" ${ord.status === 'Delivered' ? 'selected' : ''}>✅ Delivered</option>
                            <option value="Cancelled" ${ord.status === 'Cancelled' ? 'selected' : ''}>❌ Cancelled</option>
                        </select>
                    </td>
                    <td class="text-end">
                        <button class="btn btn-sm btn-outline-danger" title="Delete Order" onclick="deleteSingleOrder('${ord.orderId}')">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // Status Update Handler
        window.updateOrderStatus = function(orderId, newStatus) {
            let orders = JSON.parse(localStorage.getItem('umar_royale_orders')) || [];
            const orderIndex = orders.findIndex(o => o.orderId === orderId);

            if (orderIndex !== -1) {
                orders[orderIndex].status = newStatus;
                localStorage.setItem('umar_royale_orders', JSON.stringify(orders));
                alert(`Order ${orderId} ka status "${newStatus}" update ho gaya hai!`);
            }
        };

        // Delete Single Order
        window.deleteSingleOrder = function(orderId) {
            if (confirm(`Kya aap order ${orderId} delete karna chahte hain?`)) {
                let orders = JSON.parse(localStorage.getItem('umar_royale_orders')) || [];
                orders = orders.filter(o => o.orderId !== orderId);
                localStorage.setItem('umar_royale_orders', JSON.stringify(orders));
                renderOrdersTable();
            }
        };

        // Clear All Orders
        function clearAllOrders() {
            if (confirm('Kya aap tamam order history delete karna chahte hain?')) {
                localStorage.removeItem('umar_royale_orders');
                renderOrdersTable();
            }
        }

        // --- PRODUCTS MANAGEMENT LOGIC ---
        const initialProducts = [
            {
                id: "prod-1",
                name: "ROYAL OUD NOIR",
                category: "EAU DE PARFUM",
                price: 280.00,
                image: "https://images.unsplash.com/photo-1541643600914-78b084683601?auto=format&fit=crop&w=800&q=80"
            }
        ];

        function getProducts() {
            const stored = localStorage.getItem('umar_royale_products');
            if (!stored) {
                localStorage.setItem('umar_royale_products', JSON.stringify(initialProducts));
                return initialProducts;
            }
            return JSON.parse(stored);
        }

        function renderCMSTable() {
            const products = getProducts();
            const tableBody = document.getElementById('cmsProductsTable');
            
            if (products.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-muted">No products found.</td></tr>';
                return;
            }

            tableBody.innerHTML = products.map(p => `
                <tr>
                    <td><img src="${p.image}" width="45" height="45" style="object-fit:cover; border-radius:4px;"></td>
                    <td>
                        <div class="fw-bold">${p.name}</div>
                        <small class="text-muted">${p.category}</small>
                    </td>
                    <td class="fw-bold text-success">$${Number(p.price).toFixed(2)}</td>
                    <td class="text-end">
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteProduct('${p.id}')">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        document.getElementById('addProductForm')?.addEventListener('submit', function(e) {
            e.preventDefault();
            const products = getProducts();
            
            products.push({
                id: 'prod-' + Date.now(),
                name: document.getElementById('prodName').value,
                category: document.getElementById('prodCategory').value,
                price: parseFloat(document.getElementById('prodPrice').value),
                image: document.getElementById('prodImage').value
            });

            localStorage.setItem('umar_royale_products', JSON.stringify(products));
            this.reset();
            renderCMSTable();
            alert('Product added successfully!');
        });

        window.deleteProduct = function(id) {
            if (confirm('Delete this product?')) {
                let products = getProducts().filter(p => p.id !== id);
                localStorage.setItem('umar_royale_products', JSON.stringify(products));
                renderCMSTable();
            }
        };

        // Initialize Admin Dashboard
        document.addEventListener('DOMContentLoaded', () => {
            renderOrdersTable();
            renderCMSTable();
        });
    </script>
</body>

</html>
