<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMAR ROYALE | CMS & Inventory Management</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-primary: #0d0d0d;
            --card-bg: #161616;
            --accent-gold: #c5a059;
            --text-main: #f8f9fa;
            --border-color: #2a2a2a;
        }
        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar-brand {
            letter-spacing: 3px;
            font-weight: 700;
            color: var(--accent-gold) !important;
        }
        .admin-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
        }
        .gold-text {
            color: var(--accent-gold);
        }
        .form-control, .form-select {
            background-color: #222;
            border: 1px solid var(--border-color);
            color: #fff;
        }
        .form-control:focus, .form-select:focus {
            background-color: #2a2a2a;
            color: #fff;
            border-color: var(--accent-gold);
            box-shadow: none;
        }
        .btn-gold {
            background-color: var(--accent-gold);
            color: #000;
            font-weight: 600;
            border: none;
        }
        .btn-gold:hover {
            background-color: #d4b16a;
            color: #000;
        }
        .table-dark {
            --bs-table-bg: var(--card-bg);
            --bs-table-border-color: var(--border-color);
        }
        .stock-badge {
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark border-bottom border-secondary mb-4">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="#">UMAR ROYALE CMS</a>
            <span class="badge bg-outline-warning text-gold border border-gold"><i class="fa-solid fa-boxes-stacked me-1"></i> Client Management Suite</span>
        </div>
    </nav>

    <div class="container-fluid px-4">
        
        <!-- Inventory Overview Cards -->
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="admin-card text-center">
                    <h6 class="text-muted text-uppercase small">Total Products</h6>
                    <h2 class="gold-text mb-0" id="statTotalProducts">0</h2>
                </div>
            </div>
            <div class="col-md-4">
                <div class="admin-card text-center">
                    <h6 class="text-muted text-uppercase small">Total Items in Stock</h6>
                    <h2 class="text-success mb-0" id="statTotalStock">0</h2>
                </div>
            </div>
            <div class="col-md-4">
                <div class="admin-card text-center">
                    <h6 class="text-muted text-uppercase small">Out of Stock Alerts</h6>
                    <h2 class="text-danger mb-0" id="statOutOfStock">0</h2>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <!-- Add / Edit Product Form -->
            <div class="col-lg-4">
                <div class="admin-card">
                    <h4 class="gold-text mb-3" id="formTitle"><i class="fa-solid fa-plus me-2"></i>Add New Product</h4>
                    <form id="adminProductForm">
                        <input type="hidden" id="adminProdId">

                        <div class="mb-3">
                            <label class="form-label text-muted small">PRODUCT NAME</label>
                            <input type="text" id="adminProdName" class="form-control" placeholder="e.g. Royal Oud Noir" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-muted small">CATEGORY</label>
                            <input type="text" id="adminProdCategory" class="form-control" placeholder="e.g. Luxury EDP" required>
                        </div>

                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label text-muted small">PRICE ($)</label>
                                <input type="number" step="0.01" id="adminProdPrice" class="form-control" placeholder="120.00" required>
                            </div>
                            
                            <div class="col-6 mb-3">
                                <label class="form-label text-muted small">STOCK QUANTITY</label>
                                <input type="number" id="adminProdStock" class="form-control" placeholder="10" value="10" min="0" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-muted small">IMAGE URL</label>
                            <input type="url" id="adminProdImage" class="form-control" placeholder="https://..." required>
                        </div>

                        <button type="submit" class="btn btn-gold w-100 py-2 mt-2" id="submitBtn">
                            <i class="fa-solid fa-floppy-disk me-1"></i> Save Product To Database
                        </button>
                        <button type="button" class="btn btn-outline-secondary w-100 py-2 mt-2 d-none" id="cancelEditBtn" onclick="resetForm()">
                            Cancel Edit
                        </button>
                    </form>
                </div>
            </div>

            <!-- Live Inventory Table -->
            <div class="col-lg-8">
                <div class="admin-card">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4 class="gold-text mb-0"><i class="fa-solid fa-list me-2"></i>Live Inventory</h4>
                        <div>
                            <button class="btn btn-sm btn-outline-warning me-2" onclick="seedDefaultProducts()">
                                <i class="fa-solid fa-database me-1"></i> Seed 8 Products
                            </button>
                            <button class="btn btn-sm btn-outline-light" onclick="loadAdminProducts()">
                                <i class="fa-solid fa-rotate me-1"></i> Refresh
                            </button>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-dark table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Image</th>
                                    <th>Product</th>
                                    <th>Price</th>
                                    <th>Stock Level</th>
                                    <th>Status</th>
                                    <th class="text-end">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="adminProductTableBody">
                                <tr>
                                    <td colspan="7" class="text-center py-4 text-muted">Loading inventory from Supabase...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        // ==========================================
        // SUPABASE CONFIGURATION
        // Client Creds yahan paste karein
        // ==========================================
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';

        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let adminProductsList = [];

        // 8 Pre-configured Initial Products Array
        const INITIAL_PRODUCTS = [
            { name: "NoorUl-Ain Royal Oud", category: "Extrait De Parfum", price: 245.00, stock_quantity: 12, is_available: true, image: "https://images.unsplash.com/photo-1594035910387-fea47794261f?auto=format&fit=crop&w=400&q=80" },
            { name: "Aventus Absolu Royale", category: "Luxury EDP", price: 280.00, stock_quantity: 8, is_available: true, image: "https://images.unsplash.com/photo-1523293182086-7651a899d37f?auto=format&fit=crop&w=400&q=80" },
            { name: "Velvet Amber Intense", category: "Eau De Parfum", price: 185.00, stock_quantity: 4, is_available: true, image: "https://images.unsplash.com/photo-1588405748880-12d1d2a59f75?auto=format&fit=crop&w=400&q=80" },
            { name: "Imperial Saffron Oud", category: "Extrait De Parfum", price: 310.00, stock_quantity: 0, is_available: false, image: "https://images.unsplash.com/photo-1547887537-6158d64c35b3?auto=format&fit=crop&w=400&q=80" },
            { name: "Rose De Taif Noir", category: "Floral Perfume Oil", price: 150.00, stock_quantity: 15, is_available: true, image: "https://images.unsplash.com/photo-1616949755610-8c9bbc08f138?auto=format&fit=crop&w=400&q=80" },
            { name: "Midnight Musk Royale", category: "Eau De Parfum", price: 195.00, stock_quantity: 3, is_available: true, image: "https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?auto=format&fit=crop&w=400&q=80" },
            { name: "Gold Leather Concentree", category: "Luxury Attar", price: 220.00, stock_quantity: 10, is_available: true, image: "https://images.unsplash.com/photo-1595425970377-c9703cf48b6d?auto=format&fit=crop&w=400&q=80" },
            { name: "Symphony Of Oud", category: "Extrait De Parfum", price: 299.00, stock_quantity: 2, is_available: true, image: "https://images.unsplash.com/photo-1528740561666-dc2479dc08ab?auto=format&fit=crop&w=400&q=80" }
        ];

        // Load Products
        async function loadAdminProducts() {
            const tableBody = document.getElementById('adminProductTableBody');
            if (!tableBody) return;

            const { data: products, error } = await _supabase
                .from('products')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error("Error loading products:", error);
                tableBody.innerHTML = `<tr><td colspan="7" class="text-center text-danger py-4">Database Connection Pending / Error: ${error.message}</td></tr>`;
                return;
            }

            adminProductsList = products || [];
            updateInventoryStats();

            if (adminProductsList.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="7" class="text-center py-4 text-muted">
                            No products found in database.<br>
                            <button class="btn btn-sm btn-gold mt-2" onclick="seedDefaultProducts()">Click to Seed 8 Default Perfumes</button>
                        </td>
                    </tr>`;
                return;
            }

            tableBody.innerHTML = adminProductsList.map((prod, index) => {
                const stockQty = prod.stock_quantity ?? 0;
                
                let statusBadge = '';
                if (stockQty <= 0) {
                    statusBadge = '<span class="badge bg-danger stock-badge">OUT OF STOCK</span>';
                } else if (stockQty <= 5) {
                    statusBadge = '<span class="badge bg-warning text-dark stock-badge">LOW STOCK</span>';
                } else {
                    statusBadge = '<span class="badge bg-success stock-badge">IN STOCK</span>';
                }

                return `
                    <tr>
                        <td>${index + 1}</td>
                        <td>
                            <img src="${prod.image}" width="44" height="44" style="object-fit:cover; border-radius:4px; border:1px solid #333;" 
                                 onerror="this.src='https://via.placeholder.com/44?text=No+Img'">
                        </td>
                        <td>
                            <strong>${prod.name}</strong><br>
                            <small class="text-muted">${prod.category || 'N/A'}</small>
                        </td>
                        <td class="gold-text fw-bold">$${Number(prod.price).toFixed(2)}</td>
                        <td>
                            <div class="d-flex align-items-center gap-2">
                                <button class="btn btn-sm btn-outline-secondary px-2 py-0" onclick="updateStockQuick('${prod.id}', ${stockQty - 1})">-</button>
                                <span class="fw-bold px-1">${stockQty}</span>
                                <button class="btn btn-sm btn-outline-secondary px-2 py-0" onclick="updateStockQuick('${prod.id}', ${stockQty + 1})">+</button>
                            </div>
                        </td>
                        <td>${statusBadge}</td>
                        <td class="text-end">
                            <button class="btn btn-sm btn-outline-info me-1" onclick="editProduct('${prod.id}')">
                                <i class="fa-solid fa-pen-to-square"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteProduct('${prod.id}')">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // Seed Default 8 Products Into Supabase Table
        async function seedDefaultProducts() {
            if (!confirm("Kya aap 8 Default Luxury Products database me upload karna chahte hain?")) return;

            const { error } = await _supabase.from('products').insert(INITIAL_PRODUCTS);

            if (error) {
                alert("Seeding Error: " + error.message);
            } else {
                alert("8 Luxury Products successfully database me add ho gaye hain!");
                loadAdminProducts();
            }
        }

        function updateInventoryStats() {
            const totalProducts = adminProductsList.length;
            const totalStock = adminProductsList.reduce((acc, p) => acc + (p.stock_quantity || 0), 0);
            const outOfStockCount = adminProductsList.filter(p => (p.stock_quantity || 0) <= 0).length;

            document.getElementById('statTotalProducts').textContent = totalProducts;
            document.getElementById('statTotalStock').textContent = totalStock;
            document.getElementById('statOutOfStock').textContent = outOfStockCount;
        }

        async function handleProductSave(e) {
            e.preventDefault();

            const productId = document.getElementById('adminProdId').value;
            const name = document.getElementById('adminProdName').value.trim();
            const category = document.getElementById('adminProdCategory').value.trim();
            const price = parseFloat(document.getElementById('adminProdPrice').value);
            const stockQty = parseInt(document.getElementById('adminProdStock').value) || 0;
            const image = document.getElementById('adminProdImage').value.trim();

            const payload = { name, category, price, stock_quantity: stockQty, is_available: stockQty > 0, image };
            const submitBtn = document.getElementById('submitBtn');

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-1"></i> Saving...';

            let result;
            if (productId) {
                result = await _supabase.from('products').update(payload).eq('id', productId);
            } else {
                result = await _supabase.from('products').insert([payload]);
            }

            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fa-solid fa-floppy-disk me-1"></i> Save Product To Database';

            if (result.error) {
                alert("Error: " + result.error.message);
            } else {
                resetForm();
                loadAdminProducts();
            }
        }

        async function updateStockQuick(productId, newQty) {
            if (newQty < 0) newQty = 0;
            await _supabase.from('products').update({ stock_quantity: newQty, is_available: newQty > 0 }).eq('id', productId);
            loadAdminProducts();
        }

        function editProduct(productId) {
            const prod = adminProductsList.find(p => p.id === productId);
            if (!prod) return;

            document.getElementById('adminProdId').value = prod.id;
            document.getElementById('adminProdName').value = prod.name;
            document.getElementById('adminProdCategory').value = prod.category || '';
            document.getElementById('adminProdPrice').value = prod.price;
            document.getElementById('adminProdStock').value = prod.stock_quantity ?? 0;
            document.getElementById('adminProdImage').value = prod.image;

            document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-pen-to-square me-2"></i>Edit Product';
            document.getElementById('submitBtn').innerHTML = '<i class="fa-solid fa-check me-1"></i> Update Product';
            document.getElementById('cancelEditBtn').classList.remove('d-none');
        }

        function resetForm() {
            document.getElementById('adminProductForm').reset();
            document.getElementById('adminProdId').value = '';
            document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-plus me-2"></i>Add New Product';
            document.getElementById('submitBtn').innerHTML = '<i class="fa-solid fa-floppy-disk me-1"></i> Save Product To Database';
            document.getElementById('cancelEditBtn').classList.add('d-none');
        }

        async function deleteProduct(productId) {
            if (!confirm("Delete product?")) return;
            await _supabase.from('products').delete().eq('id', productId);
            loadAdminProducts();
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadAdminProducts();
            document.getElementById('adminProductForm')?.addEventListener('submit', handleProductSave);

            _supabase.channel('admin-stock-sync')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'products' }, loadAdminProducts)
                .subscribe();
        });
    </script>
</body>
</html>
